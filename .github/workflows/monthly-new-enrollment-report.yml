# 每月 1 日香港 10:00 寄出上一個曆月的新報讀整體報告。
# 與逢星期二、五的試堂及轉正、追收學費分開。
# 準時觸發由 Supabase pg_cron 呼叫 monthly-new-enrollment-report，再 workflow_dispatch 本檔。
# 本檔仍保留 GitHub schedule，作為後備；寄出紀錄會擋住重複。
# cron：UTC 02:00 的每月 1 日＝香港同日 10:00。
# Secrets：SUPABASE_ACCESS_TOKEN、RESEND_API_KEY

name: Monthly new enrollment report

on:
  schedule:
    - cron: "0 2 1 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只查庫組文、不寄信（true／false）"
        required: false
        default: "false"
      send_day:
        description: "香港發送日 YYYY-MM-DD（空＝香港今日）"
        required: false
        default: ""
      month:
        description: "報告月份 YYYY-MM（空＝發送日的上一個曆月）"
        required: false
        default: ""
      scheduled:
        description: "Supabase 排程觸發（true／false）"
        required: false
        default: "false"
      force:
        description: "已寄出仍再寄（true／false）"
        required: false
        default: "false"

concurrency:
  group: monthly-new-enrollment-report
  cancel-in-progress: false

jobs:
  send:
    name: Build monthly PDF and send
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Chinese font
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF libraries
        run: pip install reportlab fonttools

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.110.0

      - name: Link production project ref
        run: |
          mkdir -p supabase/.temp
          echo gudmbilboyhouotilrvt > supabase/.temp/project-ref
          printf '%s\n' '{"ref":"gudmbilboyhouotilrvt","name":"MainHope_production","organization_id":"qbuyalxfxbhqtjsuflce","organization_slug":"qbuyalxfxbhqtjsuflce"}' > supabase/.temp/linked-project.json

      - name: Query, build, send
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          SEND_DAY: ${{ github.event_name == 'workflow_dispatch' && inputs.send_day || '' }}
          MONTH: ${{ github.event_name == 'workflow_dispatch' && inputs.month || '' }}
          SCHEDULED: ${{ github.event_name == 'workflow_dispatch' && inputs.scheduled || 'false' }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || 'false' }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "缺少 GitHub secret：SUPABASE_ACCESS_TOKEN" >&2
            exit 1
          fi
          if [ "${DRY_RUN}" != "true" ] && [ -z "${RESEND_API_KEY:-}" ]; then
            echo "缺少 GitHub secret：RESEND_API_KEY" >&2
            exit 1
          fi
          ARGS=()
          if [ "${DRY_RUN}" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          if [ "${SCHEDULED}" = "true" ]; then
            ARGS+=(--scheduled)
          fi
          if [ "${FORCE}" = "true" ]; then
            ARGS+=(--force)
          fi
          if [ -n "${SEND_DAY}" ]; then
            ARGS+=(--send-day "${SEND_DAY}")
          fi
          if [ -n "${MONTH}" ]; then
            ARGS+=(--month "${MONTH}")
          fi
          python3 scripts/send_monthly_new_enrollment_report.py "${ARGS[@]}"

# 每天寄出「明日課堂」老師電郵（自動寄出由 2026-10-13 起；函式內閘）。
# 2026-10-20 起：香港 17:37 寄出翌日課堂（cron 帶時區，避開整點）。
# 舊的香港 18:00／20:00 若仍送到，slot=retired，函式略過。
# 可人手 workflow_dispatch。Secrets：TOMORROW_LESSON_CRON_SECRET
# 備註：新 schedule 若從未跑過，GitHub 可能漏第一次 cron；以 workflow_dispatch 或改檔重註冊補救。

name: Tomorrow teacher lesson reminder

on:
  schedule:
    # 香港 17:37（2026-10-20 起）。分鐘避開整點，減輕 Actions 排程擠塞。
    - cron: "37 17 * * *"
      timezone: Asia/Hong_Kong
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只查庫組文、不寄信（true／false）"
        required: false
        default: "false"
      simulate_to:
        description: "模擬收件信箱（有填則全部寄去此址，不寄老師）"
        required: false
        default: ""
      force:
        description: "略過自動開始日閘（true／false）"
        required: false
        default: "false"
      target_date:
        description: "指定目標上課日 YYYY-MM-DD（預設＝香港翌日）"
        required: false
        default: ""

concurrency:
  group: tomorrow-teacher-lesson-reminder
  cancel-in-progress: false

jobs:
  send:
    name: Call Edge Function
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Invoke tomorrow-teacher-lesson-reminder
        env:
          CRON_SECRET: ${{ secrets.TOMORROW_LESSON_CRON_SECRET }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          SIMULATE_TO: ${{ github.event_name == 'workflow_dispatch' && inputs.simulate_to || '' }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || 'false' }}
          TARGET_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.target_date || '' }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "缺少 GitHub secret：TOMORROW_LESSON_CRON_SECRET" >&2
            exit 1
          fi
          SLOT=""
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              "37 17 * * *") SLOT="1737" ;;
              "0 10 * * *"|"0 12 * * *") SLOT="retired" ;;
              *)
                echo "未識別的排程：${{ github.event.schedule }}" >&2
                exit 1
                ;;
            esac
          fi
          BODY='{}'
          if [ "${DRY_RUN}" = "true" ]; then
            BODY=$(jq -cn \
              --argjson dry true \
              --arg td "${TARGET_DATE}" \
              '{dry_run:$dry} + (if $td != "" then {target_date:$td} else {} end)')
          elif [ -n "${SIMULATE_TO}" ]; then
            BODY=$(jq -cn \
              --arg to "$SIMULATE_TO" \
              --arg td "${TARGET_DATE}" \
              '{simulate_to:$to} + (if $td != "" then {target_date:$td} else {} end)')
          elif [ "${FORCE}" = "true" ] || [ -n "${TARGET_DATE}" ]; then
            BODY=$(jq -cn \
              --argjson force "$([ "${FORCE}" = "true" ] && echo true || echo false)" \
              --arg td "${TARGET_DATE}" \
              '{force:$force} + (if $td != "" then {target_date:$td} else {} end)')
          fi
          if [ -n "${SLOT}" ]; then
            BODY=$(printf '%s' "${BODY}" | jq -c --arg slot "${SLOT}" '. + {slot:$slot}')
          fi
          CODE=$(curl -sS -o /tmp/ttl-out.json -w "%{http_code}" \
            -X POST \
            "https://gudmbilboyhouotilrvt.supabase.co/functions/v1/tomorrow-teacher-lesson-reminder" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            --data "${BODY}")
          echo "HTTP ${CODE}"
          cat /tmp/ttl-out.json
          echo
          test "${CODE}" = "200"

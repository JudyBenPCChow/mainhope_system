# 明學IT狗離線對答檢查（每日）
# 失敗時 workflow 會標紅（exit code 1），可在 Actions 通知／Email 得知。

name: Apo offline check

on:
  schedule:
    # 每日 UTC 01:00 ≈ 香港時間 09:00
    - cron: "0 1 * * *"
  workflow_dispatch:

concurrency:
  group: apo-offline-check
  cancel-in-progress: true

jobs:
  apo-check:
    name: npm run apo:check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run apo offline check
        run: npm run apo:check

      - name: Upload check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apo-offline-check-report
          path: reports/apo-offline-check-*.md
          if-no-files-found: warn
          retention-days: 30

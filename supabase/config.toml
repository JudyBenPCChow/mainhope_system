# 明學 mingxue-admin — Supabase 本地／部署設定（精簡）

[api]
enabled = true

[functions.apo-chat]
verify_jwt = true

[functions.ai-report]
verify_jwt = true

[functions.create-mgmt-user]
verify_jwt = true

[functions.reset-mgmt-user-password]
verify_jwt = true

[functions.void-payment]
verify_jwt = true

[functions.admin-ops-assistant]
verify_jwt = true

# 由 GitHub Actions cron 以 MISSING_ROLL_CALL_CRON_SECRET 呼叫；函式內自驗密鑰。
[functions.missing-roll-call-admin-report]
verify_jwt = false

# 由 Supabase pg_cron 以 SCHEDULED_EMAIL_CRON_SECRET 呼叫；人手仍可用舊 cron secret。
[functions.tomorrow-teacher-lesson-reminder]
verify_jwt = false

# 星期二、五行政 PDF：排程呼叫後轉觸發 GitHub Actions 產生附件。
[functions.admin-pdf-reports]
verify_jwt = false

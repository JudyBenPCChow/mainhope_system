<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>明學教育 — 行政側欄 IA 沙盒</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --brand-950: #172d57;
      --brand-900: #1e3a6e;
      --brand-700: #2a4e8a;
      --brand-500: #3b6ab3;
      --primary: #2563eb;
      --primary-soft: #eff6ff;
      --background: #f4f7fb;
      --card: #ffffff;
      --foreground: #172033;
      --muted: #64748b;
      --border: #dde4ee;
      --success: #15803d;
      --warning: #c26908;
      --shadow: 0 1px 2px rgba(15, 23, 42, .05), 0 8px 24px rgba(15, 23, 42, .05);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      font-family: "Noto Sans TC", "PingFang TC", sans-serif;
      color: var(--foreground);
      background: var(--background);
      font-size: 15px;
      line-height: 1.5;
    }

    button, input, select { font: inherit; }

    button { -webkit-tap-highlight-color: transparent; }

    .icon {
      width: 20px;
      height: 20px;
      flex: 0 0 auto;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .app-shell {
      display: flex;
      width: 100%;
      height: 100vh;
      min-height: 620px;
      overflow: hidden;
    }

    .sidebar {
      position: relative;
      z-index: 10;
      display: flex;
      width: 256px;
      min-width: 256px;
      height: 100%;
      flex-direction: column;
      overflow: hidden;
      color: #fff;
      background: linear-gradient(180deg, var(--brand-900) 0%, var(--brand-700) 58%, var(--brand-500) 100%);
      border-right: 1px solid rgba(255, 255, 255, .12);
      box-shadow: 6px 0 28px -12px rgba(23, 45, 87, .58);
      transition: width 180ms ease, min-width 180ms ease;
    }

    .sidebar.collapsed {
      width: 68px;
      min-width: 68px;
    }

    .brand-row {
      display: flex;
      min-height: 74px;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 14px 12px 14px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, .12);
    }

    .brand-copy {
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
    }

    .brand-name {
      font-size: 1.02rem;
      font-weight: 700;
      letter-spacing: -.015em;
    }

    .brand-subtitle {
      margin-top: 1px;
      color: rgba(255, 255, 255, .72);
      font-size: .8rem;
    }

    .sidebar.collapsed .brand-copy,
    .sidebar.collapsed .footer-copy,
    .sidebar.collapsed .role-card {
      display: none;
    }

    .icon-button {
      display: inline-flex;
      width: 38px;
      height: 38px;
      flex: 0 0 auto;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 10px;
      color: #fff;
      background: rgba(255, 255, 255, .08);
      cursor: pointer;
      transition: background 160ms ease;
    }

    .icon-button:hover,
    .icon-button:focus-visible {
      background: rgba(255, 255, 255, .18);
      outline: none;
    }

    .sidebar.collapsed .brand-row {
      justify-content: center;
      padding-inline: 10px;
    }

    .nav-list {
      display: flex;
      min-height: 0;
      flex: 1;
      flex-direction: column;
      gap: 4px;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 14px 12px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, .25) transparent;
    }

    .sidebar.collapsed .nav-list {
      align-items: center;
      padding-inline: 10px;
    }

    .nav-item,
    .group-button {
      display: flex;
      width: 100%;
      min-height: 40px;
      align-items: center;
      gap: 11px;
      border: 0;
      border-radius: 9px;
      padding: 8px 11px;
      color: rgba(255, 255, 255, .92);
      background: transparent;
      text-align: left;
      cursor: pointer;
      white-space: nowrap;
      transition: background 160ms ease, box-shadow 160ms ease;
    }

    .nav-item:hover,
    .group-button:hover,
    .nav-item:focus-visible,
    .group-button:focus-visible {
      color: #fff;
      background: rgba(255, 255, 255, .15);
      outline: none;
    }

    .nav-item.active {
      color: #fff;
      background: rgba(255, 255, 255, .22);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .14), 0 2px 8px rgba(23, 45, 87, .16);
    }

    .group-button.child-active {
      background: rgba(255, 255, 255, .10);
    }

    .nav-label {
      min-width: 0;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: .95rem;
      font-weight: 500;
    }

    .sidebar.collapsed .nav-item,
    .sidebar.collapsed .group-button {
      width: 42px;
      justify-content: center;
      padding-inline: 0;
    }

    .sidebar.collapsed .nav-label,
    .sidebar.collapsed .chevron,
    .sidebar.collapsed .subnav {
      display: none;
    }

    .chevron {
      width: 16px;
      height: 16px;
      transition: transform 160ms ease;
    }

    .group-button[aria-expanded="true"] .chevron {
      transform: rotate(180deg);
    }

    .subnav {
      display: grid;
      gap: 2px;
      margin: 2px 0 3px 17px;
      padding: 3px 0 3px 11px;
      border-left: 2px solid rgba(255, 255, 255, .22);
    }

    .subnav .nav-item {
      min-height: 34px;
      gap: 9px;
      padding: 6px 9px;
      border-radius: 8px;
    }

    .subnav .icon {
      width: 17px;
      height: 17px;
    }

    .subnav .nav-label {
      font-size: .855rem;
      font-weight: 500;
    }

    .sidebar-footer {
      flex: 0 0 auto;
      padding: 12px;
      border-top: 1px solid rgba(255, 255, 255, .12);
      background: linear-gradient(0deg, rgba(23, 45, 87, .48), transparent);
    }

    .role-card {
      margin-bottom: 8px;
      padding: 8px 10px;
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 9px;
      background: rgba(255, 255, 255, .08);
    }

    .role-label {
      color: rgba(255, 255, 255, .66);
      font-size: .7rem;
      font-weight: 600;
      letter-spacing: .03em;
    }

    .role-value {
      margin-top: 1px;
      font-size: .84rem;
      font-weight: 600;
    }

    .footer-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .footer-link {
      display: flex;
      min-width: 0;
      height: 38px;
      flex: 1;
      align-items: center;
      gap: 9px;
      border: 0;
      border-radius: 9px;
      padding: 0 10px;
      color: rgba(255, 255, 255, .9);
      background: transparent;
      cursor: pointer;
    }

    .footer-link:hover,
    .footer-link:focus-visible {
      background: rgba(255, 255, 255, .12);
      outline: none;
    }

    .sidebar.collapsed .sidebar-footer {
      padding-inline: 10px;
    }

    .sidebar.collapsed .footer-actions {
      flex-direction: column;
    }

    .sidebar.collapsed .footer-link {
      width: 42px;
      flex: 0 0 42px;
      justify-content: center;
      padding: 0;
    }

    .main {
      min-width: 0;
      flex: 1;
      overflow: auto;
    }

    .sandbox-toolbar {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      min-height: 58px;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 10px 22px;
      border-bottom: 1px solid var(--border);
      background: rgba(255, 255, 255, .94);
      backdrop-filter: blur(10px);
    }

    .sandbox-title {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 10px;
    }

    .sandbox-badge {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 3px 9px;
      color: #92400e;
      background: #fef3c7;
      border: 1px solid #fde68a;
      font-size: .72rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .sandbox-heading {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: .88rem;
      font-weight: 600;
    }

    .view-controls {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      flex-wrap: wrap;
    }

    .control-button {
      min-height: 34px;
      padding: 5px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #475569;
      background: #fff;
      cursor: pointer;
      font-size: .78rem;
      font-weight: 600;
    }

    .control-button:hover,
    .control-button:focus-visible,
    .control-button.active {
      color: var(--primary);
      border-color: #93c5fd;
      background: var(--primary-soft);
      outline: none;
    }

    .content {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 28px 30px 48px;
    }

    .page-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 22px;
    }

    .eyebrow {
      margin: 0 0 4px;
      color: var(--primary);
      font-size: .76rem;
      font-weight: 700;
      letter-spacing: .06em;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.7rem, 3vw, 2.35rem);
      line-height: 1.2;
      letter-spacing: -.035em;
    }

    .page-description {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: .92rem;
    }

    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 10px;
      border: 1px solid #bbf7d0;
      border-radius: 999px;
      color: var(--success);
      background: #f0fdf4;
      font-size: .78rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: #22c55e;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 18px;
    }

    .metric-card,
    .panel,
    .feature-section {
      border: 1px solid var(--border);
      border-radius: 13px;
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .metric-card {
      padding: 17px 18px;
    }

    .metric-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: .78rem;
      font-weight: 600;
    }

    .metric-icon {
      display: inline-flex;
      width: 34px;
      height: 34px;
      align-items: center;
      justify-content: center;
      border-radius: 9px;
      color: var(--primary);
      background: var(--primary-soft);
    }

    .metric-value {
      margin-top: 9px;
      font-size: 1.7rem;
      font-weight: 700;
      letter-spacing: -.025em;
    }

    .metric-foot {
      margin-top: 2px;
      color: var(--muted);
      font-size: .74rem;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(280px, .65fr);
      gap: 16px;
    }

    .panel {
      padding: 18px;
    }

    .panel-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 13px;
    }

    .panel h2 {
      margin: 0;
      font-size: 1rem;
      letter-spacing: -.015em;
    }

    .text-button {
      border: 0;
      color: var(--primary);
      background: transparent;
      cursor: pointer;
      font-size: .78rem;
      font-weight: 600;
    }

    .schedule-list,
    .notice-list {
      display: grid;
      gap: 9px;
    }

    .schedule-row,
    .notice-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 11px;
      border: 1px solid #edf0f5;
      border-radius: 9px;
      background: #fbfcfe;
    }

    .time-block {
      min-width: 63px;
      color: var(--primary);
      font-size: .78rem;
      font-weight: 700;
    }

    .row-main {
      min-width: 0;
      flex: 1;
    }

    .row-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: .84rem;
      font-weight: 600;
    }

    .row-meta {
      margin-top: 1px;
      color: var(--muted);
      font-size: .72rem;
    }

    .tiny-tag {
      flex: 0 0 auto;
      padding: 2px 7px;
      border-radius: 999px;
      color: var(--success);
      background: #dcfce7;
      font-size: .67rem;
      font-weight: 700;
    }

    .tiny-tag.warning {
      color: var(--warning);
      background: #ffedd5;
    }

    .workspace-panel {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .workspace-body {
      min-height: 330px;
      padding: 22px;
    }

    .local-nav {
      display: flex;
      gap: 2px;
      overflow-x: auto;
      padding: 0 16px;
      border-bottom: 1px solid var(--border);
      scrollbar-width: thin;
    }

    .local-tab {
      flex: 0 0 auto;
      min-height: 47px;
      margin-bottom: -1px;
      padding: 0 12px;
      border: 0;
      border-bottom: 2px solid transparent;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      font-size: .84rem;
      font-weight: 600;
    }

    .local-tab:hover,
    .local-tab:focus-visible {
      color: var(--foreground);
      outline: none;
    }

    .local-tab.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    .local-select-wrap {
      display: none;
      padding: 14px;
      border-bottom: 1px solid var(--border);
    }

    .local-select {
      width: 100%;
      min-height: 40px;
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 7px 10px;
      color: var(--foreground);
      background: #fff;
    }

    .empty-illustration {
      display: grid;
      min-height: 260px;
      place-items: center;
      text-align: center;
    }

    .empty-icon {
      display: inline-flex;
      width: 52px;
      height: 52px;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
      border-radius: 14px;
      color: var(--primary);
      background: var(--primary-soft);
    }

    .empty-illustration h2 {
      margin: 0;
      font-size: 1.05rem;
    }

    .empty-illustration p {
      max-width: 480px;
      margin: 6px auto 0;
      color: var(--muted);
      font-size: .84rem;
    }

    .search-box {
      position: relative;
      width: min(480px, 100%);
      margin-bottom: 18px;
    }

    .search-box .icon {
      position: absolute;
      top: 50%;
      left: 12px;
      width: 18px;
      height: 18px;
      color: #94a3b8;
      transform: translateY(-50%);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      min-height: 43px;
      padding: 8px 13px 8px 39px;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--foreground);
      background: #fff;
      outline: none;
      box-shadow: 0 1px 2px rgba(15, 23, 42, .03);
    }

    .search-input:focus {
      border-color: #93c5fd;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, .11);
    }

    .feature-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .feature-section {
      overflow: hidden;
    }

    .feature-section h2 {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      background: #f8fafc;
      font-size: .88rem;
    }

    .feature-list {
      display: grid;
    }

    .feature-link {
      display: flex;
      align-items: center;
      gap: 9px;
      min-height: 41px;
      padding: 8px 13px;
      border: 0;
      border-bottom: 1px solid #eef2f7;
      color: #334155;
      background: #fff;
      text-align: left;
      cursor: pointer;
      font-size: .8rem;
    }

    .feature-link:last-child { border-bottom: 0; }

    .feature-link:hover,
    .feature-link:focus-visible {
      color: var(--primary);
      background: var(--primary-soft);
      outline: none;
    }

    .feature-link .icon {
      width: 17px;
      height: 17px;
      color: #64748b;
    }

    .feature-empty {
      display: none;
      padding: 38px 16px;
      color: var(--muted);
      text-align: center;
      border: 1px dashed var(--border);
      border-radius: 12px;
      background: rgba(255, 255, 255, .55);
    }

    .height-note {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: .76rem;
      white-space: nowrap;
    }

    .height-note strong { color: var(--foreground); }

    @media (max-width: 980px) {
      .feature-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .dashboard-grid { grid-template-columns: 1fr; }
      .height-note { display: none; }
    }

    @media (max-width: 760px) {
      .app-shell { min-width: 680px; }
      .sandbox-toolbar { padding-inline: 16px; }
      .content { padding-inline: 20px; }
      .metrics { grid-template-columns: 1fr; }
      .page-header { align-items: flex-start; flex-direction: column; }
      .local-nav { display: none; }
      .local-select-wrap { display: block; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
        animation-duration: .01ms !important;
      }
    }
  </style>
</head>

    const state = {

    const sidebar = document.getElementById("sidebar");
    const navList = document.getElementById("navList");
    const content = document.getElementById("content");
    const collapseButton = document.getElementById("collapseButton");
    const visibleCount = document.getElementById("visibleCount");

    function childGroupFor(id) {
      return navEntries.find((entry) =>
        entry.kind === "group" && entry.children.some((child) => child.id === id)
      );
    }

    function renderNav() {
      sidebar.classList.toggle("collapsed", state.collapsed);
      collapseButton.setAttribute("aria-label", state.collapsed ? "展開側欄" : "收起側欄");
      collapseButton.setAttribute("title", state.collapsed ? "展開側欄" : "收起側欄");

      navList.innerHTML = navEntries.map((entry) => {
        if (entry.kind === "item") {
          const active = state.active === entry.id;
          return `
            <button
              class="nav-item${active ? " active" : ""}"
              type="button"
              data-nav="${entry.id}"
              aria-current="${active ? "page" : "false"}"
              title="${entry.label}"
            >
              ${icon(entry.icon)}
              <span class="nav-label">${entry.label}</span>
            </button>
          `;
        }

        const open = state.openGroup === entry.id;
        const childActive = entry.children.some((child) => child.id === state.active);
        const children = open ? `
          <div class="subnav" aria-label="${entry.label}子頁">
            ${entry.children.map((child) => `
              <button
                class="nav-item${state.active === child.id ? " active" : ""}"
                type="button"
                data-nav="${child.id}"
                aria-current="${state.active === child.id ? "page" : "false"}"
              >
                ${icon(child.icon)}
                <span class="nav-label">${child.label}</span>
              </button>
            `).join("")}
          </div>
        ` : "";

        return `
          <div>
            <button
              class="group-button${childActive ? " child-active" : ""}"
              type="button"
              data-group="${entry.id}"
              aria-expanded="${open}"
              title="${entry.label}"
            >
              ${icon(entry.icon)}
              <span class="nav-label">${entry.label}</span>
              <svg class="icon chevron" aria-hidden="true"><use href="#i-chevron"></use></svg>
            </button>
            ${children}
          </div>
        `;
      }).join("");

      const expandedChildren = state.openGroup
        ? navEntries.find((entry) => entry.kind === "group" && entry.id === state.openGroup)?.children.length || 0
        : 0;
      visibleCount.textContent = state.collapsed ? "8" : String(8 + expandedChildren);
      updatePresetButtons();
    }

    function renderHome() {
      content.innerHTML = `
        <header class="page-header">

            <p class="eyebrow">管理中心</p>

              <h2>即將開始的課堂</h2>

            <div class="schedule-list">
              <div class="schedule-row">
                <div class="time-block">15:30</div>
                <div class="row-main"><div class="row-title">中二英文 A 班</div><div class="row-meta">山案座 · 陳老師</div></div>

              </div>

              </div>
              <div class="schedule-row">

                <div class="row-main"><div class="row-title">功課輔導班</div><div class="row-meta">17D · 2 位當值老師</div></div>
                <span class="tiny-tag">已編更</span>
              </div>
              <div class="schedule-row">
                <div class="time-block">17:45</div>
                <div class="row-main"><div class="row-title">中四化學</div><div class="row-meta">英仙座 · 王老師</div></div>
                <span class="tiny-tag">已準備</span>
              </div>
            </div>
          </article>

          <article class="panel">

            <div class="notice-list">
              <div class="notice-row">
                <span class="metric-icon">${icon("follow")}</span>

              </div>
              <div class="notice-row">
                <span class="metric-icon">${icon("graduation")}</span>

              <div class="notice-row">
                <span class="metric-icon">${icon("wallet")}</span>

              </div>
            </div>

      `;
    }

    function renderWorkspace(id) {
      const meta = pageMeta[id] || ["功能示意", "此功能只在沙盒中顯示示意內容。", "grid"];
      const tabs = localNavigation[id];
      const activeTab = tabs ? state.localTabs[id] : null;
      const displayTitle = activeTab || meta[0];

      content.innerHTML = `
        <header class="page-header">
          <div>
            <p class="eyebrow">${tabs ? "工作域" : "行政工作"}</p>
            <h1>${displayTitle}</h1>
            <p class="page-description">${meta[1]}</p>
          </div>
          <span class="status-chip"><span class="status-dot"></span>沙盒畫面</span>
        </header>

        <section class="workspace-panel">
          ${tabs ? `
            <nav class="local-nav" aria-label="${meta[0]}頁內導航">
              ${tabs.map((tab) => `
                <button class="local-tab${tab === activeTab ? " active" : ""}" type="button" data-local-tab="${tab}">
                  ${tab}
                </button>
              `).join("")}
            </nav>
            <div class="local-select-wrap">
              <select class="local-select" id="localSelect" aria-label="${meta[0]}頁內導航">
                ${tabs.map((tab) => `<option value="${tab}"${tab === activeTab ? " selected" : ""}>${tab}</option>`).join("")}
              </select>
            </div>
          ` : ""}
          <div class="workspace-body">
            <div class="empty-illustration">
              <div>
                <span class="empty-icon">${icon(meta[2])}</span>
                <h2>${displayTitle}內容區</h2>
                <p>本沙盒只驗證側欄高度、群組展開及頁內導航層級，不會讀取或寫入正式資料。</p>
              </div>
            </div>
          </div>
        </section>
      `;
    }

    function renderAllFeatures() {
      content.innerHTML = `
        <header class="page-header">
          <div>
            <p class="eyebrow">網站地圖</p>
            <h1>所有功能</h1>
            <p class="page-description">完整列出行政可使用的功能；搜尋放在內容區，不佔側欄高度。</p>
          </div>
          <span class="status-chip"><span class="status-dot"></span><span id="featureCount">32 項功能</span></span>
        </header>

        <div class="search-box">
          ${icon("search")}
          <input class="search-input" id="featureSearch" type="search" placeholder="搜尋功能，例如：請假、繳費、老師…" autocomplete="off" aria-label="搜尋所有功能" />
        </div>

        <div class="feature-grid" id="featureGrid">
          ${featureSections.map((section) => `
            <section class="feature-section" data-feature-section>
              <h2>${icon(section.icon)} ${section.title}</h2>
              <div class="feature-list">
                ${section.items.map(([id, label, keywords]) => `
                  <button class="feature-link" type="button" data-feature="${id}" data-search="${label} ${keywords}">
                    ${icon(pageMeta[id]?.[2] || section.icon)}
                    <span>${label}</span>
                  </button>
                `).join("")}
              </div>
            </section>
          `).join("")}
        </div>
        <div class="feature-empty" id="featureEmpty">找不到符合的功能。</div>
      `;

      const input = document.getElementById("featureSearch");
      input.addEventListener("input", filterFeatures);
    }

    function renderContent() {
      if (state.active === "home") renderHome();
      else if (state.active === "all-features") renderAllFeatures();
      else renderWorkspace(state.active);
    }

    function setActive(id) {
      state.active = id;
      const owner = childGroupFor(id);
      if (owner && !state.collapsed) state.openGroup = owner.id;
      renderNav();
      renderContent();
    }

    function toggleGroup(id) {
      if (state.collapsed) {
        state.collapsed = false;
        state.openGroup = id;
      } else {
        state.openGroup = state.openGroup === id ? null : id;
      }
      renderNav();
    }

    function setPreset(preset) {
      if (preset === "default") {
        state.collapsed = false;
        state.openGroup = null;
      } else if (preset === "courses") {
        state.collapsed = false;
        state.openGroup = "courses";
      } else if (preset === "followup") {
        state.collapsed = false;
        state.openGroup = "followup";
      } else if (preset === "collapsed") {
        state.collapsed = true;
        state.openGroup = null;
      }
      renderNav();
    }

    function updatePresetButtons() {
      document.querySelectorAll("[data-preset]").forEach((button) => {
        const preset = button.dataset.preset;
        const active =
          (preset === "default" && !state.collapsed && !state.openGroup) ||
          (preset === "courses" && !state.collapsed && state.openGroup === "courses") ||
          (preset === "followup" && !state.collapsed && state.openGroup === "followup") ||
          (preset === "collapsed" && state.collapsed);
        button.classList.toggle("active", active);
      });
    }

    function filterFeatures(event) {
      const query = event.target.value.trim().toLowerCase().replace(/\s+/g, "");
      let visible = 0;

      document.querySelectorAll("[data-feature-section]").forEach((section) => {
        let sectionVisible = 0;
        section.querySelectorAll(".feature-link").forEach((item) => {
          const haystack = item.dataset.search.toLowerCase().replace(/\s+/g, "");
          const match = !query || haystack.includes(query);
          item.hidden = !match;
          if (match) {
            visible += 1;
            sectionVisible += 1;
          }
        });
        section.hidden = sectionVisible === 0;
      });

      document.getElementById("featureGrid").style.display = visible ? "grid" : "none";
      document.getElementById("featureEmpty").style.display = visible ? "none" : "block";
      document.getElementById("featureCount").textContent = `${visible} 項功能`;
    }

    navList.addEventListener("click", (event) => {
      const navButton = event.target.closest("[data-nav]");
      if (navButton) {
        setActive(navButton.dataset.nav);
        return;
      }
      const groupButton = event.target.closest("[data-group]");
      if (groupButton) toggleGroup(groupButton.dataset.group);
    });

    collapseButton.addEventListener("click", () => {
      state.collapsed = !state.collapsed;
      if (state.collapsed) state.openGroup = null;
      renderNav();
    });

    document.querySelector(".view-controls").addEventListener("click", (event) => {
      const button = event.target.closest("[data-preset]");
      if (button) setPreset(button.dataset.preset);
    });

    document.querySelector(".sidebar-footer").addEventListener("click", (event) => {
      const button = event.target.closest("[data-footer]");
      if (button) setActive(button.dataset.footer);
    });

    content.addEventListener("click", (event) => {
      const navButton = event.target.closest("[data-nav]");
      if (navButton) {
        setActive(navButton.dataset.nav);
        return;
      }
      const openGroup = event.target.closest("[data-group-open]");
      if (openGroup) {
        state.collapsed = false;
        state.openGroup = openGroup.dataset.groupOpen;
        renderNav();
        return;
      }
      const localTab = event.target.closest("[data-local-tab]");
      if (localTab) {
        state.localTabs[state.active] = localTab.dataset.localTab;
        renderContent();
        return;
      }
      const feature = event.target.closest("[data-feature]");
      if (feature) setActive(feature.dataset.feature);
    });

    content.addEventListener("change", (event) => {
      if (event.target.id === "localSelect") {
        state.localTabs[state.active] = event.target.value;
        renderContent();
      }
    });

    renderNav();
    renderContent();
  </script>
</body>
</html>
